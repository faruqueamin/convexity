<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-label="Ranker blend: 55 percent XGBoost, 45 percent NTSM">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bxgb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bntsm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="320" rx="18" fill="url(#bbg)" stroke="#1f2a44"/>
  <text x="28" y="34" fill="#8b9cc8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3.2">SETUP RANKER</text>
  <text x="28" y="60" fill="#e9eefb" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">blend = 0.55*XGB + 0.45*tape*continuation</text>
  <text x="28" y="82" fill="#8b9cc8" font-family="Inter, Segoe UI, sans-serif" font-size="13">Watchlist if blend &gt;= 0.52   /   top 12 names   /   scores never POST to Alpaca</text>

  <g transform="translate(170,200)">
    <circle r="78" fill="none" stroke="#1f2a44" stroke-width="22"/>
    <circle r="78" fill="none" stroke="url(#bxgb)" stroke-width="22" stroke-linecap="butt"
            stroke-dasharray="269.5 490" transform="rotate(-90)"/>
    <circle r="78" fill="none" stroke="url(#bntsm)" stroke-width="22"
            stroke-dasharray="220.5 490" stroke-dashoffset="-269.5" transform="rotate(-90)"/>
    <text y="-6" text-anchor="middle" fill="#e9eefb" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">0.55 / 0.45</text>
    <text y="16" text-anchor="middle" fill="#8b9cc8" font-family="Inter, Segoe UI, sans-serif" font-size="11">XGB / NTSM</text>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="320" y="112" width="360" height="180" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35"/>
    <rect x="320" y="112" width="6" height="180" rx="3" fill="url(#bxgb)"/>
    <text x="348" y="140" fill="#22d3ee" font-size="12" font-weight="700">XGBOOST  /  CONTRACT</text>
    <text x="348" y="164" fill="#e9eefb" font-size="13" font-weight="600">9 public features</text>
    <text x="348" y="186" fill="#8b9cc8" font-size="12">spreadPct, IV, |delta|, DTE</text>
    <text x="348" y="206" fill="#8b9cc8" font-size="12">log(OI), log(vol), premium</text>
    <text x="348" y="226" fill="#8b9cc8" font-size="12">rvol, |5-bar return|</text>
    <text x="348" y="252" fill="#67e8f9" font-size="12">GBDT -&gt; sigmoid -&gt; 0-1</text>
    <text x="348" y="272" fill="#64748b" font-size="11">VOL10S_XGB_MODEL</text>

    <rect x="700" y="112" width="372" height="180" rx="12" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.35"/>
    <rect x="700" y="112" width="6" height="180" rx="3" fill="url(#bntsm)"/>
    <text x="728" y="140" fill="#f0abfc" font-size="12" font-weight="700">NTSM  /  TAPE</text>
    <text x="728" y="164" fill="#e9eefb" font-size="13" font-weight="600">Last ~20 Alpaca 1m bars</text>
    <text x="728" y="186" fill="#8b9cc8" font-size="12">ret, rangePct, volZ, closeLoc</text>
    <text x="728" y="206" fill="#8b9cc8" font-size="12">RNN hidden 8, tanh recurrence</text>
    <text x="728" y="226" fill="#8b9cc8" font-size="12">logits: call, put, continuation</text>
    <text x="728" y="252" fill="#f9a8d4" font-size="12">side = argmax(call, put)</text>
    <text x="728" y="272" fill="#64748b" font-size="11">VOL10S_NTSM_MODEL</text>
  </g>
</svg>
