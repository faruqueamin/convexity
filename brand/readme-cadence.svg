<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 268" role="img" aria-label="Runtime cadences from 3 seconds to 5 minutes">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="268" rx="18" fill="url(#cbg)" stroke="#1f2a44"/>
  <text x="28" y="34" fill="#8b9cc8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3.2">ONE PROCESS  /  DEFAULT CADENCES</text>
  <text x="28" y="60" fill="#e9eefb" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">How often each loop wakes</text>
  <text x="28" y="82" fill="#8b9cc8" font-family="Inter, Segoe UI, sans-serif" font-size="13">pm2  vol10s-paper    127.0.0.1:8977    evented sockets sit beside these timers</text>

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="220" y="108" fill="#64748b" font-size="10">3s</text>
    <text x="360" y="108" fill="#64748b" font-size="10">15s</text>
    <text x="560" y="108" fill="#64748b" font-size="10">60s</text>
    <text x="980" y="108" fill="#64748b" font-size="10">5 min</text>
    <line x1="220" y1="116" x2="1060" y2="116" stroke="#1f2a44" stroke-width="2"/>

    <text x="28" y="142" fill="#94a3b8" font-size="12">Options tick / exits</text>
    <rect x="220" y="130" width="52" height="16" rx="4" fill="#22d3ee"/>
    <text x="280" y="142" fill="#67e8f9" font-size="11">3s</text>

    <text x="28" y="170" fill="#94a3b8" font-size="12">Scan + brain + broker</text>
    <rect x="220" y="158" width="148" height="16" rx="4" fill="#818cf8"/>
    <text x="376" y="170" fill="#a5b4fc" font-size="11">15s</text>

    <text x="28" y="198" fill="#94a3b8" font-size="12">Alpaca CLI reconcile</text>
    <rect x="220" y="186" width="360" height="16" rx="4" fill="#c026d3"/>
    <text x="588" y="198" fill="#f0abfc" font-size="11">60s  account get / position list</text>

    <text x="28" y="226" fill="#94a3b8" font-size="12">Universe + supervisor</text>
    <rect x="220" y="214" width="840" height="16" rx="4" fill="#f472b6"/>
    <text x="28" y="250" fill="#64748b" font-size="11">SIP / OPRA / trade_updates are evented, not polled</text>
  </g>
</svg>
