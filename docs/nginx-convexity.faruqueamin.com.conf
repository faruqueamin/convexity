server {
    listen 80;
    listen [::]:80;
    server_name convexity.faruqueamin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name convexity.faruqueamin.com;

    ssl_certificate /etc/ssl/cloudflare/faruqueamin.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/faruqueamin.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:CONVEXITY_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 2M;

    if ($http_user_agent ~* (sqlmap|nikto|havij|nmap|masscan|zgrab)) {
        return 403;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:8977/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://127.0.0.1:8977;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
